name: Foundation CI
on:
  pull_request:
  push:
    branches: [main, dev/comando-01-fundacao]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-root
          MYSQL_DATABASE: arqueo_demo
          MYSQL_USER: arqueo_app
          MYSQL_PASSWORD: ci-disposable-app
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: arqueo_demo
      DB_USER: arqueo_app
      DB_PASSWORD: ci-disposable-app
      DEMO_PASSWORD: ci-synthetic-password-only-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm install --ignore-scripts --package-lock=false
      - name: Configuração descartável de testes
        run: touch .env
      - run: npm run build
      - run: npm test
      - run: npm run migrate
      - name: Migração idempotente
        run: npm run migrate
      - run: npm run seed
      - run: npm run test:integration
      - name: Rollback em banco descartável
        run: npm run migrate -- down
        env:
          ALLOW_DESTRUCTIVE_ROLLBACK: 'yes'
      - name: Reaplicar após rollback
        run: npm run migrate
      - name: Auditoria de dependências
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high
